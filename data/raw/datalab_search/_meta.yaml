notes: ratio는 '요청 그룹들 × 요청 기간'의 상대값. rescaled = ratio / (같은 batch_id·date의 앵커 ratio).
  앵커 자신은 1.0. 앵커 ratio가 0인 날은 NaN. 카테고리 개념이 없어 전 배치가 동일 앵커를 쓰므로 배치 간 rescaled 비교가
  가능하다. [2026-07 씨드 관찰] 배치 간 앵커 raw ratio가 달랐다 = 재정규화 필수. T3와 달리 모든 키워드가 31/31일 전부
  채워져 나온다(희소 키워드도 결측 없음) — 검색어트렌드가 더 조밀한 시계열이다.

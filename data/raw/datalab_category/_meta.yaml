notes: ratio는 '요청에 포함된 카테고리들 × 요청 기간' 안의 상대값이라 원칙적으로 배치 간 비교 불가. rescaled = ratio
  / (같은 batch_id·date의 앵커 ratio) 로 재정규화한 값이며 분석은 rescaled를 쓴다. 앵커 자신의 rescaled는 1.0.
  앵커 ratio가 0인 날은 rescaled를 NaN으로 둔다(0 나누기 방지). [2026-07 씨드 관찰] 앵커 '패션의류'가 모든 배치에서
  최대 카테고리라 분모가 늘 같았고, 그 결과 raw ratio가 우연히 배치 간 일치했다. 이는 API의 성질이 아니라 배치 구성의 결과이므로
  raw ratio를 그대로 비교해도 된다고 일반화하지 말 것 — 앵커보다 큰 카테고리가 배치에 들어오면 스케일이 바뀐다.

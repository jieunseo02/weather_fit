  직접 비교 불가 — 카테고리를 넘는 비교는 T4(datalab_search)를 쓸 것. [2026-07 씨드 관찰] 배치 간 앵커(''반팔티'')
  raw ratio가 실제로 달랐다 = 배치별 정규화가 확인됐고 재정규화가 필수다. ⚠️ 클릭이 적은 키워드는 ratio 0이 아니라 **그 날짜
  행 자체가 응답에서 빠진다** (2026-07: 롱패딩 28/31일, 레인코트 1/31일, 방수자켓 0/31일 = 행 없음). processed
  단계에서 날짜축으로 reindex한 뒤 ''결측=0으로 볼지, 미관측으로 볼지''를 반드시 명시적으로 결정할 것. 그냥 join하면 조용히 NaN이
  되어 평균·상관이 왜곡된다.'

# 타깃 정의 — 무엇을 "패션 수요"로 측정할 것인가
#
# 이 파일이 곧 target 데이터셋의 명세다.
# T1(카테고리 클릭지수) / T3(키워드 클릭지수) / T4(검색어트렌드) 수집기가 이 파일을 읽는다.
# 상세는 docs/datasets.md §2
#
# ── cid 출처 (2026-08-18 확인) ────────────────────────────
# 데이터랩 웹 UI가 카테고리 트리를 받아오는 내부 엔드포인트에서 추출했다.
#   https://datalab.naver.com/shoppingInsight/getCategory.naver?cid={부모cid}
#   (Referer: https://datalab.naver.com/shoppingInsight/sCategory.naver)
# 응답 childList[].cid / .name 을 그대로 옮겼으므로 추측값이 아니다.
# 데이터랩 카테고리 트리는 네이버 쇼핑 카테고리와 동일 체계이며
# 공식 조회 API가 없어(docs/datasets.md §2 T1) 이 경로가 유일한 확인 수단이다.

# ── 재스케일링 앵커 ───────────────────────────────────────
# 데이터랩 응답 ratio는 "요청 묶음 안에서의 상대값"이라 배치가 다르면 비교 불가.
# 모든 요청 배치에 이 앵커를 공통으로 포함시키고, 수집 후 앵커 대비 비율로 재정규화한다.
anchor:
  category: {name: 패션의류, cid: "50000000"}
  keyword: 반팔티          # 연중 검색량이 끊기지 않는 키워드 (0 나누기 방지)

# T3(키워드 클릭지수)는 "카테고리 안에서의" 상대값이다.
# 따라서 앵커 키워드도 그 카테고리 안에서 클릭이 잡혀야 한다.
# 예: 화장품/미용 카테고리에서 '반팔티'를 조회하면 ratio가 0이라 앵커로 못 쓴다.
# → 카테고리별 앵커를 따로 둔다. 전역 anchor.keyword 는 패션의류용 기본값이다.
keyword_anchor_by_cid:
  "50000000": 반팔티       # 패션의류   — 검증 완료 (2026-07 씨드에서 ratio>0 확인)
  "50000001": 양말         # 패션잡화   — 검증 완료 (2026-07 씨드에서 ratio>0 확인)
  "50000002": 립스틱       # 화장품/미용 — ⚠️ 미검증. 씨드 미수집 구간. 백필 전 1회 호출로 확인할 것
  "50000007": 등산화       # 스포츠/레저 — ⚠️ 미검증. 위와 동일

# ── T1: 중분류 카테고리 (베이스라인 시계열) ───────────────
# 네이버 실제 카테고리 트리에 맞춰 원안을 일부 조정했다. 조정 사유는 각 항목 주석 참조.
mid_categories:
  - {l1: 패션의류,    l2: 여성의류,    cid: "50000167"}
  - {l1: 패션의류,    l2: 남성의류,    cid: "50000169"}
  # 원안 "가방"·"신발"은 네이버에 단일 중분류로 존재하지 않고 성별로 갈린다 → 4개로 분리
  - {l1: 패션잡화,    l2: 여성신발,    cid: "50000173"}
  - {l1: 패션잡화,    l2: 남성신발,    cid: "50000174"}
  - {l1: 패션잡화,    l2: 여성가방,    cid: "50000176"}
  - {l1: 패션잡화,    l2: 남성가방,    cid: "50000177"}
  - {l1: 패션잡화,    l2: 모자,        cid: "50000181"}
  - {l1: 패션잡화,    l2: 양말,        cid: "50000166"}
  - {l1: 패션잡화,    l2: 장갑,        cid: "50000182"}   # 원안에 없었으나 한파 신호로 유용해 추가
  # 원안 "액세서리"는 정확히 대응하는 중분류가 없다. 후보: 주얼리(50000189) /
  # 패션소품(50000185) / 헤어액세서리(50000184). 가장 통상적인 '액세서리' 의미로 주얼리를 택함.
  - {l1: 패션잡화,    l2: 주얼리,      cid: "50000189"}
  # 원안 "우산"은 중분류가 아니라 소분류다 (패션잡화 > 패션소품 > 우산).
  # 데이터랩 category API는 소분류 cid도 그대로 받으므로 level 3으로 수집한다.
  - {l1: 패션잡화,    l2: 우산,        cid: "50001482", level: 3, parent: "50000185"}
  - {l1: 스포츠/레저, l2: 수영,        cid: "50000164"}   # 원안 "수영/수상스포츠" → 실제 명칭 "수영"
  - {l1: 스포츠/레저, l2: 등산,        cid: "50000027"}
  - {l1: 화장품/미용, l2: 선케어,      cid: "50000191"}

# ── T3·T4: 날씨 민감 키워드 (이벤트 분석의 실제 신호) ─────
# 중분류는 뭉뚱그려져 날씨 효과가 희석된다. 진짜 신호는 이 30개에 있다.
# trigger는 가설이며, W3~W4 EDA에서 검증·수정 대상이다.
#
# cid = T3에서 이 그룹을 조회할 대분류.
#   ⚠️ 한 그룹 안의 키워드가 실제로는 서로 다른 카테고리에 속할 수 있다
#      (예: rain 그룹의 '레인코트'는 패션의류인데 그룹 cid는 패션잡화).
#      그런 키워드는 ratio가 낮게 나온다 — 잘못된 값이 아니라 "그 카테고리 안에서는 소수"라는 뜻.
#      백필 전에 EDA로 확인하고 필요하면 그룹을 쪼갤 것.
#   T4(검색어트렌드)는 카테고리 개념이 없어 cid를 무시한다.
weather_sensitive:
  outerwear_winter:
    trigger: t_min <= 0 or cold_wave
    cid: "50000000"
    items: [패딩, 롱패딩, 코트, 무스탕]
  outerwear_transition:
    trigger: 일교차 >= 10 or transition
    cid: "50000000"
    items: [트렌치코트, 야상, 가죽자켓, 블레이저]
  top_warm:
    trigger: 5 <= t_avg <= 15
    cid: "50000000"
    items: [니트, 가디건, 후드티, 맨투맨]
  top_summer:
    trigger: t_max >= 25
    cid: "50000000"
    items: [반팔티, 민소매, 린넨셔츠]
  bottom_summer:
    trigger: t_max >= 28
    cid: "50000000"
    items: [반바지, 린넨팬츠]
  rain:
    trigger: precip_mm > 0 or monsoon or 호우특보
    cid: "50000001"
    items: [우산, 레인부츠, 레인코트, 방수자켓]
  beach:
    trigger: t_max >= 30 or 폭염특보
    cid: "50000007"
    items: [수영복, 래쉬가드, 아쿠아슈즈]
  cold_acc:
    trigger: t_min <= -5 or 한파특보
    cid: "50000001"
    items: [히트텍, 목도리, 장갑, 기모레깅스]
  sun:
    trigger: t_max >= 28
    cid: "50000002"
    items: [선크림, 선글라스, 버킷햇]
  shoes_seasonal:
    trigger: 시즌·기온별
    cid: "50000001"
    items: [부츠, 어그, 샌들]

# ── 수집 배치 구성 규칙 ───────────────────────────────────
# T1: 요청당 카테고리 최대 3개 → [앵커, A, B] 로 2개씩 소진
# T3: 요청당 키워드 최대 5개  → [앵커, A, B, C, D] 로 4개씩 소진
# T4: 키워드 그룹 최대 5개, 그룹당 키워드 20개
# 기간은 절대 쪼개지 말 것 (3년 한 번에). 부득이 쪼개면 30일 이상 overlap 후 체이닝.

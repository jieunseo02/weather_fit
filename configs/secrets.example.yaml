# API 토큰 템플릿
#
#   cp configs/secrets.example.yaml configs/secrets.yaml
#
# secrets.yaml 은 .gitignore 대상. 절대 커밋하지 않는다.
# 실수로 커밋했다면 파일 삭제로 끝내지 말고 해당 키를 폐기·재발급할 것.
#
# 발급처와 용도는 docs/datasets.md §4 참조.

# ── 1. 기상청 API 허브 (필수) ─────────────────────────────
# https://apihub.kma.go.kr  → 회원가입 + 휴대폰 등록 필수(미등록 시 호출 불가)
# 용도: W1 지상관측 / W2 중기기온 / W3 중기육상 / W4 기상특보 — 이 키 하나로 전부
# 주의: 공공데이터포털(data.go.kr) 키와 별개 체계. 혼용 금지.
kma_apihub:
  auth_key: ""

# ── 2-A. 네이버 개발자센터 (기존 방식 · 유예 2027-06-30) ──
# https://developers.naver.com/apps  → 애플리케이션 등록
# 사용 API에 아래 2개를 각각 추가해야 함 (누락 시 401):
#   - 데이터랩(쇼핑인사이트)  → T1, T2, T3
#   - 데이터랩(검색어트렌드)  → T4
# 환경: WEB / 서비스 URL: http://localhost
#
# 2026-07-31자로 데이터랩은 NAVER API HUB로 이관됐다.
# 유예 대상자는 2027-06-30까지 이 방식이 동작하며, 8주 프로젝트는 그 안에 끝난다.
# → scripts/check_keys.py 로 동작 여부를 먼저 확인할 것. 되면 이 키만으로 충분하다.
naver:
  client_id: ""
  client_secret: ""

# ── 2-B. NAVER API HUB (신규 표준 · 2-A가 안 될 때) ───────
# 네이버클라우드 플랫폼 콘솔 > NAVER API HUB 에서 발급 (기존 키 재사용 불가)
# 도메인: naverapihub.apigw.ntruss.com
# 헤더:   X-NCP-APIGW-API-KEY-ID / X-NCP-APIGW-API-KEY
# 한도:   쇼핑인사이트 월 50,000건, 검색어트렌드 월 50,000건, 50 RPS
# 요금:   한시적 무료 (유료 전환 시 별도 공지)
naver_api_hub:
  access_key_id: ""
  secret_key: ""

# ── 3. 공공데이터포털 (권장) ──────────────────────────────
# https://www.data.go.kr  → 활용신청
# 용도: C1 공휴일(한국천문연구원 특일 정보), C2 미세먼지(에어코리아)
# Decoding 키를 넣고 requests 의 params 인자로 전달할 것 (직접 URL 인코딩 금지)
data_go_kr:
  service_key: ""

# ── 4. KOSIS (선택) ───────────────────────────────────────
# https://kosis.kr/openapi/  → 활용신청
# 용도: C3 온라인쇼핑동향(의복·신발 월별 거래액) — 검색지수 검증용 ground truth
kosis:
  api_key: ""

# ── 토큰 불필요 ───────────────────────────────────────────
# 구글 트렌드(T7): pytrends — 인증 없음. 단 비공식 라이브러리라 429 잦음(요청 간격 필수)
# 카카오: 쇼핑하우 공개 API가 존재하지 않음 → 키 발급 불필요 (docs/datasets.md §4 참조)
